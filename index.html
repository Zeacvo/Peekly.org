<!doctype html>
<html lang="en" class="dark" style="background-color: #000000; color: #ffffff;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />

    <meta name="description" content="Tactical FACEIT CS2 intelligence suite. Real-time matchroom performance stats, map pool radar analysis, Elo tracking, and zero-latency lobby automations." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />

    <!-- Critical instant dark background to prevent white flash in Mobile Safari / Telegram WebView -->
    <style>
      html, body, #root {
        background-color: #000000 !important;
        color: #ffffff !important;
        margin: 0;
        padding: 0;
        min-height: 100%;
        overflow-x: hidden;
      }
      @font-face {
        font-family: 'Inter Fallback';
        src: local('Arial');
        ascent-override: 90%;
        descent-override: 22%;
        line-gap-override: 0%;
        size-adjust: 107%;
      }
    </style>

    <!-- Font Preconnect, Preload & Stylesheet with display=swap for instant LCP and zero CLS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa0ZL7SUc.woff2" as="font" type="font/woff2" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://peekly.org" />

    <!-- Favicon & Icons (Google Favicon Guidelines) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48x48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://peekly.org" />
    <meta property="og:site_name" content="Peekly" />
    <meta property="og:title" content="Peekly — Tactical FACEIT CS2 Intelligence & Automation Suite" />
    <meta property="og:description" content="Tactical FACEIT CS2 intelligence suite. Real-time matchroom performance stats, map pool radar analysis, Elo tracking, and zero-latency lobby automations." />
    <meta property="og:image" content="https://peekly.org/logo.jpg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Peekly — Tactical FACEIT CS2 Intelligence" />
    <meta name="twitter:description" content="Tactical FACEIT CS2 intelligence suite. Real-time matchroom performance stats, map pool radar analysis, Elo tracking, and zero-latency lobby automations." />
    <meta name="twitter:image" content="https://peekly.org/logo.jpg" />
  </head>
  <body class="bg-[#000000] text-white antialiased selection:bg-[#FF5500] selection:text-black" style="background-color: #000000; color: #ffffff;">
    <div id="root" class="min-h-screen flex flex-col bg-[#000000] text-white selection:bg-[#FF5500] selection:text-black font-sans antialiased relative" style="background-color: #000000; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column;">

        <div class="w-full max-w-6xl mx-auto px-3 sm:px-4 md:px-6 h-16 sm:h-20 flex items-center justify-between" style="width: 100%; max-width: 72rem; margin: 0 auto; padding: 0 1rem; height: 64px; display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 10px; height: 48px;">
            <svg role="img" aria-label="Peekly Logo" width="44" height="28" viewBox="6 22 88 56" fill="none" xmlns="http://www.w3.org/2000/svg" style="height: 28px; width: auto; color: #ffffff;">

              <rect x="56.5" y="48.25" width="11.5" height="3.5" rx="0.5" fill="currentColor"/>
            </svg>
            <span style="font-family: 'Inter', -apple-system, sans-serif; font-size: 20px; font-weight: 900; letter-spacing: 0.05em; color: #ffffff; line-height: 1;">PEEKLY</span>
          </div>
          <div class="flex items-center gap-6 shrink-0" style="display: flex; align-items: center; gap: 1.5rem; flex-shrink: 0;">
            <div class="hidden sm:inline-flex items-center gap-1.5" style="display: none;">
              <span style="font-family: 'Inter', sans-serif; font-size: 13px; color: #a3a3a3;">Online: 0</span>
            </div>
            <span style="font-family: 'Inter', monospace; font-size: 13px; color: #a3a3a3;">&gt;_ Changelog</span>
            <div style="display: inline-flex; align-items: center;">
              <span style="font-family: 'Inter', sans-serif; font-size: 13px; color: #a3a3a3;">English</span>
            </div>
            <div class="hidden sm:inline-flex items-center justify-center text-center h-8 sm:h-9 px-3 sm:px-3.5 md:px-4 lg:px-5 font-sans font-bold text-[10px] sm:text-[11px] md:text-xs tracking-wider uppercase ml-2" style="display: none; height: 36px; padding: 0 1rem; margin-left: 0.5rem; background-color: #ffffff; color: #000000; font-weight: 700; font-size: 11px; letter-spacing: 0.05em;">
              INSTALL EXTENSION

          </div>
        </div>

        <section class="relative pt-[calc(6rem+env(safe-area-inset-top,0px))] sm:pt-24 md:pt-28 pb-8 sm:pb-12 md:pb-14 min-h-[calc(100vh-13rem)] sm:min-h-[calc(100vh-13.5rem)] w-full max-w-6xl mx-auto px-4 sm:px-6 flex flex-col items-center justify-center text-center z-10" style="position: relative; width: 100%; max-width: 72rem; margin: 0 auto; padding: calc(6rem + env(safe-area-inset-top, 0px)) 1.5rem 3rem; min-height: calc(100vh - 13.5rem); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
          <h1 class="text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-bold tracking-tight text-white max-w-4xl leading-[1.08] mb-5 drop-shadow-[0_8px_32px_rgba(0,0,0,0.95)] break-words" style="font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; color: #ffffff; max-width: 56rem; line-height: 1.08; margin: 0 auto 1.25rem; font-size: clamp(2rem, 5vw, 4.5rem); letter-spacing: -0.025em; text-shadow: 0 8px 32px rgba(0, 0, 0, 0.95);">
            DOMINATE THE LOBBY
          </h1>
          <p class="text-sm sm:text-lg md:text-xl font-normal text-neutral-400 tracking-normal leading-relaxed max-w-2xl mb-6 sm:mb-7 drop-shadow-[0_4px_16px_rgba(0,0,0,0.95)]" style="font-family: 'Inter', -apple-system, sans-serif; font-size: clamp(0.875rem, 2vw, 1.25rem); font-weight: 400; color: #a3a3a3; max-width: 42rem; margin: 0 auto 1.75rem; line-height: 1.625;">
            High-performance matchroom intelligence, player analytics, and automation overlays for competitive FACEIT CS2.
          </p>
          <div style="display: flex; flex-direction: column; align-items: center;">
            <div style="display: inline-flex; align-items: center; justify-content: center; gap: 0.75rem; padding: 0.85rem 1.75rem; background-color: #ffffff; color: #000000; font-family: 'Inter', -apple-system, sans-serif; font-size: 0.875rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid #ffffff;">
              <svg role="img" aria-label="Google Chrome Logo" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" style="width: 24px; height: 24px; flex-shrink: 0;">
                <path d="M12 0C8.21 0 4.831 1.757 2.632 4.501l3.953 6.848A5.454 5.454 0 0 1 12 6.545h10.691A12 12 0 0 0 12 0zM1.931 5.47A11.943 11.943 0 0 0 0 12c0 6.012 4.42 10.991 10.189 11.864l3.953-6.847a5.45 5.45 0 0 1-6.865-2.29zm13.342 2.166a5.446 5.446 0 0 1 1.45 7.09l.002.001h-.002l-5.344 9.257c.206.01.413.016.621.016 6.627 0 12-5.373 12-12 0-1.54-.29-3.011-.818-4.364zM12 16.364a4.364 4.364 0 1 1 0-8.728 4.364 4.364 0 0 1 0 8.728Z"/>
              </svg>
              <span>ADD TO CHROME</span>
            </div>
          </div>
        </section>
      </main>

      <footer class="w-full bg-[#000000] border-t border-white/10 relative z-10 mt-auto py-8 sm:py-10" style="width: 100%; border-top: 1px solid rgba(255, 255, 255, 0.1); background-color: #000000; margin-top: auto; padding: 2rem 1rem;">
        <div class="w-full max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between" style="width: 100%; max-width: 72rem; margin: 0 auto; padding: 0 1rem; display: flex; justify-content: space-between; align-items: center;">
          <span style="font-family: 'Inter', sans-serif; font-size: 11px; color: #737373;">Peekly &copy; 2026</span>
          <span style="font-family: 'Inter', sans-serif; font-size: 11px; color: #737373;">Privacy Policy</span>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
